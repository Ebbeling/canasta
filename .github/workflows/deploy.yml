name: Deploy

on:
  push:
    branches: [main]
  # Zodat een deploy ook handmatig opnieuw gestart kan worden, bijvoorbeeld
  # nadat GitHub Pages in de repo-instellingen is aangezet.
  workflow_dispatch:

# Alleen wat de Pages-deploy echt nodig heeft. Er is geen secret in het spel;
# `id-token` laat de deploy-actie zich met OIDC legitimeren.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwere push vervangt een lopende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: de toernooiserver gebruikt de ingebouwde SQLite van Node
      # (node:sqlite). Die zit zonder vlag pas in 23.4 en is stabiel in 24, en
      # `npm run check` draait ook de servertests.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` en niet `npm install`: de lockfile is leidend in CI.
      - run: npm ci

      # Apart in plaats van `npm run check`, zodat de naam van de stap zegt wat
      # er stuk is zonder de logs open te hoeven klappen. Faalt er een, dan
      # draait de deploy-job niet — die hangt aan `needs: build`.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
